name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run release gate
        run: |
          npm install
          npm test
      - name: Remove test dependencies from the static artifact
        run: rm -rf node_modules
      - name: Write deploy identity
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          BUILD_NUMBER="$(node -p "require('./version.json').version")"
          printf '{"commit":"%s","version":"%s","build":%s}\n' "$GITHUB_SHA" "$PACKAGE_VERSION" "$BUILD_NUMBER" > deploy-info.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
